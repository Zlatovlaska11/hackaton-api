<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Tester</title>
    <!-- Load Socket.io Client from CDN -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none; }
        input[type="text"], input[type="password"], input[type="number"] { padding: 8px; margin: 5px 0; width: calc(100% - 20px); box-sizing: border-box; }
        button { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #messages { height: 300px; overflow-y: scroll; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 4px; background: white; border: 1px solid #ddd; }
        .system-msg { color: #888; font-style: italic; font-size: 0.9em; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>WebSocket Chat Tester</h2>

    <!-- Auth Section -->
    <div id="authSection" class="card">
        <h3>1. Authentication (Login / Register)</h3>
        <input type="text" id="username" placeholder="Username (e.g., john)"><br>
        <input type="password" id="password" placeholder="Password (e.g., changeme)"><br>
        <button onclick="login()">Login</button>
        <button onclick="register()">Register New</button>
        <p id="authStatus"></p>
    </div>

    <!-- Chat Section -->
    <div id="chatSection" class="card hidden">
        <h3>2. Chat <span id="currentUser" style="color: #007bff;"></span></h3>
        <p>Status: <strong id="socketStatus" style="color: red;">Disconnected</strong></p>
        
        <div id="messages"></div>
        
        <div style="display: flex; gap: 10px;">
            <input type="number" id="receiverId" placeholder="Receiver ID (e.g., 2)" style="width: 150px;">
            <input type="text" id="messageText" placeholder="Type a message..." style="flex-grow: 1;">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';
        let socket = null;
        let currentToken = null;

        function logSystemMsg(text) {
            const msgs = document.getElementById('messages');
            msgs.innerHTML += `<div class="system-msg">${text}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                // The API expects urlencoded for LocalAuthGuard by default in NestJS (unless configured otherwise), but we'll try json first if that's what the docs say, wait docs say x-www-form-urlencoded for login.
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username, password })
                });
                
                if (!response.ok) throw new Error('Login failed');
                
                const data = await response.json();
                handleTokenReceived(data.access_token, username);
            } catch (err) {
                document.getElementById('authStatus').innerText = 'Error: ' + err.message;
            }
        }

        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (!response.ok) throw new Error('Registration failed');
                
                const data = await response.json();
                handleTokenReceived(data.access_token, username);
            } catch (err) {
                document.getElementById('authStatus').innerText = 'Error: ' + err.message;
            }
        }

        function handleTokenReceived(token, username) {
            currentToken = token;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('chatSection').classList.remove('hidden');
            document.getElementById('currentUser').innerText = `(@${username})`;
            
            connectWebSocket();
        }

        function connectWebSocket() {
            logSystemMsg('Connecting to WebSocket...');
            
            // Connect to Socket.io server
            socket = io(API_URL);

            socket.on('connect', () => {
                document.getElementById('socketStatus').innerText = 'Connected - Authenticating...';
                document.getElementById('socketStatus').style.color = '#ff9800';
                
                // Send auth token as required by documentation
                socket.emit('auth', { token: currentToken });
            });

            socket.on('auth_result', (res) => {
                if (res.success) {
                    document.getElementById('socketStatus').innerText = 'Authenticated & Ready';
                    document.getElementById('socketStatus').style.color = 'green';
                    logSystemMsg('Successfully authenticated with WebSocket server.');
                } else {
                    document.getElementById('socketStatus').innerText = 'Auth Failed';
                    document.getElementById('socketStatus').style.color = 'red';
                    logSystemMsg('Auth failed: ' + res.message);
                }
            });

            socket.on('receive_message', (msg) => {
                const msgs = document.getElementById('messages');
                msgs.innerHTML += `
                    <div class="message">
                        <strong>User ${msg.senderId} -> User ${msg.receiverId}:</strong><br>
                        ${msg.text}
                    </div>
                `;
                msgs.scrollTop = msgs.scrollHeight;
            });

            socket.on('error', (err) => {
                logSystemMsg('Error from server: ' + (err.message || JSON.stringify(err)));
            });

            socket.on('disconnect', () => {
                document.getElementById('socketStatus').innerText = 'Disconnected';
                document.getElementById('socketStatus').style.color = 'red';
                logSystemMsg('Disconnected from server.');
            });
        }

        function sendMessage() {
            if (!socket) return;
            
            const receiverId = parseInt(document.getElementById('receiverId').value);
            const text = document.getElementById('messageText').value;
            
            if (!receiverId || !text) {
                alert('Please enter a receiver ID and a message.');
                return;
            }
            
            socket.emit('send_message', { receiverId, text });
            document.getElementById('messageText').value = ''; // clear input
        }
    </script>
</body>
</html>
